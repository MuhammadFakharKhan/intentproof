[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intentproof-local"
version = "0.3.0"
description = "Offline outcome contracts and fault-injection tests for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Hackathon contributors"}]

[project.scripts]
intentproof = "intentproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
